<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olive Young 購物隨身計算器 (含紀錄與即時換算)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f8f9fa;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    h2 { margin-top: 0; color: #8cb811; font-size: 20px; }
    h3 { margin-top: 0; color: #444; font-size: 16px; }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input, select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }
    input[type="text"] { flex: 2; }
    input[type="number"] { flex: 1; }
    input[type="date"] { padding: 8px; font-size: 14px; }
    input:focus, select:focus { border-color: #8cb811; }

    .realtime-twd {
      font-size: 13px;
      color: #2b78e4;
      font-weight: bold;
      margin-top: -4px;
      margin-bottom: 2px;
    }
    
    .btn-main {
      padding: 12px 16px;
      background: #8cb811;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-main:active { background: #769c0e; }

    .btn-checkout {
      padding: 14px 16px;
      background: #d93025;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      box-shadow: 0 2px 6px rgba(217, 48, 37, 0.3);
    }
    .btn-checkout:active { background: #b3261e; }
    
    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }
    .item-name { font-weight: 500; font-size: 15px; }
    .item-price { color: #666; font-size: 13px; }
    .item-twd { color: #2b78e4; font-size: 13px; font-weight: 500; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 8px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty-count { font-size: 14px; font-weight: bold; min-width: 18px; text-align: center; }

    .action-btns {
      display: flex;
      gap: 4px;
    }
    .edit-btn {
      background: #2b78e4;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .delete-btn {
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .summary-box {
      background: #f0f7e6;
      border: 1px solid #cce599;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .summary-row.total {
      font-size: 18px;
      font-weight: bold;
      color: #d93025;
      border-top: 1px dashed #ccc;
      padding-top: 8px;
      margin-bottom: 0;
    }
    .tax-notice {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }

    /* 歷史紀錄區塊 */
    .history-card {
      border-left: 4px solid #8cb811;
      padding: 12px;
      background: #fdfdfd;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }
    .history-items {
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .history-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      color: #d93025;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛍️ Olive Young 記帳助手</h2>
    <div class="input-group">
      <div class="input-row">
        <label style="font-size: 14px; font-weight: bold;">日期：</label>
        <input type="date" id="record-date">
      </div>
      <input type="text" id="item-name" placeholder="商品名稱（例：護手霜）">
      <div class="input-row">
        <input type="number" id="item-price" placeholder="單價 (₩)" inputmode="numeric" oninput="updateRealtimeTwd()">
        <input type="number" id="item-qty" placeholder="數量" value="1" min="1" inputmode="numeric" style="width: 60px;" oninput="updateRealtimeTwd()">
      </div>
      <div id="realtime-twd" class="realtime-twd">💡 折合台幣：NT$ 0</div>
      <button id="add-btn" class="btn-main" onclick="addItem()">新增至購物車</button>
    </div>
  </div>

  <div class="card">
    <h3>🛒 本次購物車清單</h3>
    <ul id="item-list" class="item-list"></ul>

    <div class="summary-box">
      <div class="summary-row">
        <span>原價總計：</span>
        <span>₩ <span id="subtotal">0</span> <small style="color:#666;">(NT$ <span id="subtotal-twd">0</span>)</small></span>
      </div>
      <div class="summary-row" style="color: #2b78e4;">
        <span>預計現場退稅：</span>
        <span>- ₩ <span id="tax-refund">0</span> <small>(NT$ <span id="refund-twd">0</span>)</small></span>
      </div>
      <div class="summary-row total">
        <span>實付預估金額：</span>
        <span>₩ <span id="final-total">0</span> <br><small style="font-size: 14px; font-weight: normal; display: block; text-align: right;">(約 NT$ <span id="final-twd">0</span>)</small></span>
      </div>
      <div class="tax-notice" id="tax-status">
        💡 滿 ₩15,000 即可享現場即時退稅（記得出示護照）
      </div>
    </div>

    <button class="btn-checkout" onclick="checkout()">🛍️ 完成結帳並儲存紀錄</button>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3 style="margin: 0;">📜 歷史結帳紀錄</h3>
      <button onclick="clearHistory()" style="background:none; border:none; color:#ff4d4f; cursor:pointer; font-size:12px;">清空歷史</button>
    </div>
    <div id="history-list"></div>
  </div>

  <script>
    const EXCHANGE_RATE = 0.02375; // 刷卡估算匯率 (韓元 × 0.02375 ≈ 台幣)
    let items = [];
    let history = JSON.parse(localStorage.getItem('oy_history') || '[]');
    let editingId = null;

    // 初始化日期預設為今天
    document.getElementById('record-date').value = new Date().toISOString().split('T')[0];

    // 輸入金額時即時計算台幣
    function updateRealtimeTwd() {
      const price = parseInt(document.getElementById('item-price').value) || 0;
      const qty = parseInt(document.getElementById('item-qty').value) || 1;
      const totalKrw = price * qty;
      const twd = Math.round(totalKrw * EXCHANGE_RATE);
      document.getElementById('realtime-twd').innerText = `💡 單件約 NT$ ${Math.round(price * EXCHANGE_RATE).toLocaleString()} | 小計 NT$ ${twd.toLocaleString()}`;
    }

    // 韓國現場即時退稅階梯計算
    function calculateTaxRefund(amount) {
      if (amount < 15000) return 0;
      if (amount < 30000) return 1000;
      if (amount < 50000) return 2000;
      if (amount < 75000) return 3500;
      if (amount < 100000) return 5000;
      if (amount < 125000) return 6000;
      if (amount < 150000) return 7500;
      if (amount < 175000) return 9000;
      if (amount < 200000) return 10000;
      if (amount < 250000) return 12000;
      if (amount < 300000) return 15000;
      if (amount < 350000) return 18000;
      if (amount < 400000) return 21000;
      if (amount < 450000) return 24000;
      if (amount < 500000) return 27000;
      return Math.floor(amount * 0.06);
    }

    function addItem() {
      const nameInput = document.getElementById('item-name');
      const priceInput = document.getElementById('item-price');
      const qtyInput = document.getElementById('item-qty');

      const name = nameInput.value.trim() || `商品 ${items.length + 1}`;
      const price = parseInt(priceInput.value);
      const qty = parseInt(qtyInput.value) || 1;

      if (isNaN(price) || price <= 0) {
        alert('請輸入有效的金額！');
        return;
      }

      if (editingId) {
        const item = items.find(i => i.id === editingId);
        if (item) {
          item.name = name;
          item.price = price;
          item.qty = qty;
        }
        editingId = null;
        document.getElementById('add-btn').innerText = '新增至購物車';
        document.getElementById('add-btn').style.background = '#8cb811';
      } else {
        items.push({ id: Date.now(), name, price, qty });
      }

      nameInput.value = '';
      priceInput.value = '';
      qtyInput.value = '1';
      updateRealtimeTwd();
      updateUI();
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        document.getElementById('item-name').value = item.name;
        document.getElementById('item-price').value = item.price;
        document.getElementById('item-qty').value = item.qty;
        editingId = id;
        
        document.getElementById('add-btn').innerText = '儲存修改';
        document.getElementById('add-btn').style.background = '#2b78e4';
        updateRealtimeTwd();
      }
    }

    function changeQty(id, delta) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          deleteItem(id);
          return;
        }
        updateUI();
      }
    }

    function deleteItem(id) {
      items = items.filter(item => item.id !== id);
      if (editingId === id) {
        editingId = null;
        document.getElementById('add-btn').innerText = '新增至購物車';
        document.getElementById('add-btn').style.background = '#8cb811';
      }
      updateUI();
    }

    function updateUI() {
      const ul = document.getElementById('item-list');
      ul.innerHTML = '';
      let subtotal = 0;

      items.forEach(item => {
        const itemTotalKrw = item.price * item.qty;
        const itemTotalTwd = Math.round(itemTotalKrw * EXCHANGE_RATE);
        subtotal += itemTotalKrw;

        const li = document.createElement('li');
        li.className = 'item-row';
        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-price">₩ ${item.price.toLocaleString()} × ${item.qty} = ₩ ${itemTotalKrw.toLocaleString()}</span>
            <span class="item-twd">≈ NT$ ${itemTotalTwd.toLocaleString()}</span>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
            <span class="qty-count">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
          <div class="action-btns">
            <button class="edit-btn" onclick="editItem(${item.id})">編輯</button>
            <button class="delete-btn" onclick="deleteItem(${item.id})">刪除</button>
          </div>
        `;
        ul.appendChild(li);
      });

      const refund = calculateTaxRefund(subtotal);
      const finalTotal = subtotal - refund;

      document.getElementById('subtotal').innerText = subtotal.toLocaleString();
      document.getElementById('subtotal-twd').innerText = Math.round(subtotal * EXCHANGE_RATE).toLocaleString();

      document.getElementById('tax-refund').innerText = refund.toLocaleString();
      document.getElementById('refund-twd').innerText = Math.round(refund * EXCHANGE_RATE).toLocaleString();

      document.getElementById('final-total').innerText = finalTotal.toLocaleString();
      document.getElementById('final-twd').innerText = Math.round(finalTotal * EXCHANGE_RATE).toLocaleString();

      const statusEl = document.getElementById('tax-status');
      if (subtotal === 0) {
        statusEl.innerText = '💡 滿 ₩15,000 即可享現場即時退稅（記得出示護照）';
        statusEl.style.color = '#666';
      } else if (subtotal < 15000) {
        const diff = 15000 - subtotal;
        statusEl.innerText = `⚠️ 還差 ₩${diff.toLocaleString()} (約 NT$${Math.round(diff * EXCHANGE_RATE)}) 即可達到退稅門檻！`;
        statusEl.style.color = '#d93025';
      } else {
        statusEl.innerText = '✅ 已達退稅門檻！結帳時請直接出示護照即可現場扣抵退稅款。';
        statusEl.style.color = '#8cb811';
      }
    }

    function checkout() {
      if (items.length === 0) {
        alert('購物車是空的，無法結帳！');
        return;
      }

      const date = document.getElementById('record-date').value || new Date().toISOString().split('T')[0];
      let subtotal = 0;
      items.forEach(i => subtotal += i.price * i.qty);
      const refund = calculateTaxRefund(subtotal);
      const finalKrw = subtotal - refund;
      const finalTwd = Math.round(finalKrw * EXCHANGE_RATE);

      const record = {
        id: Date.now(),
        date: date,
        items: [...items],
        subtotal: subtotal,
        refund: refund,
        finalKrw: finalKrw,
        finalTwd: finalTwd
      };

      history.unshift(record);
      localStorage.setItem('oy_history', JSON.stringify(history));

      items = [];
      updateUI();
      renderHistory();
      alert(`🎉 結帳成功！已存入 ${date} 的歷史紀錄中。`);
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      if (history.length === 0) {
        container.innerHTML = '<div style="color:#888; font-size:14px; text-align:center; padding:10px;">尚無歷史紀錄</div>';
        return;
      }

      container.innerHTML = '';
      history.forEach((rec) => {
        const itemSummary = rec.items.map(i => `${i.name} ×${i.qty}`).join('、');
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-header">
            <span>📅 ${rec.date}</span>
            <button onclick="deleteHistoryItem(${rec.id})" style="background:none; border:none; color:#ff4d4f; cursor:pointer;">刪除</button>
          </div>
          <div class="history-items">🛒 ${itemSummary}</div>
          <div class="history-footer">
            <span>實付：₩ ${rec.finalKrw.toLocaleString()}</span>
            <span>≈ NT$ ${rec.finalTwd.toLocaleString()}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function deleteHistoryItem(id) {
      if (confirm('確定要刪除這筆歷史紀錄嗎？')) {
        history = history.filter(h => h.id !== id);
        localStorage.setItem('oy_history', JSON.stringify(history));
        renderHistory();
      }
    }

    function clearHistory() {
      if (confirm('確定要清空所有歷史紀錄嗎？')) {
        history = [];
        localStorage.removeItem('oy_history');
        renderHistory();
      }
    }

    renderHistory();
  </script>
</body>
</html>
